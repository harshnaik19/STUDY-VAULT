<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - StudyVault</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .auth-page {
      min-height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.15), transparent 40%),
                  radial-gradient(circle at bottom left, rgba(236, 72, 153, 0.1), transparent 40%),
                  var(--bg-dark);
      padding: 20px;
    }
    .auth-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 440px;
      padding: 36px 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-logo {
      width: 54px;
      height: 54px;
      background: linear-gradient(135deg, var(--primary), #818cf8);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: white;
      margin: 0 auto 16px auto;
      box-shadow: 0 8px 20px var(--primary-glow);
    }
    .auth-header h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 700;
    }
    .auth-header p {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 6px;
    }
    .auth-alert {
      background-color: rgba(244, 63, 94, 0.15);
      border: 1px solid var(--priority-high);
      color: #fda4af;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
      font-size: 14px;
      color: var(--text-muted);
    }
    .auth-footer a {
      color: #818cf8;
      text-decoration: none;
      font-weight: 600;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
    .btn-auth-submit {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--primary), #4f46e5);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px var(--primary-glow);
      transition: var(--transition);
      margin-top: 8px;
    }
    .btn-auth-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
    }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <i class="fa-solid fa-vault"></i>
        </div>
        <h2>Welcome to StudyVault</h2>
        <p>Log in to access your study resources & tasks</p>
      </div>

      {% if error %}
        <div class="auth-alert">
          <i class="fa-solid fa-circle-exclamation"></i>
          <span>{{ error }}</span>
        </div>
      {% endif %}

      <form method="POST" action="/login{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}">
        <div class="form-group full">
          <label for="email">Student Email Address</label>
          <input type="email" id="email" name="email" placeholder="e.g. alex@college.edu" required autofocus>
        </div>

        <div class="form-group full">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn-auth-submit">
          <i class="fa-solid fa-right-to-bracket"></i> Log In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/register">Create Account</a>
      </div>
      
      <div style="text-align: center; margin-top: 16px; font-size: 12px; color: var(--text-dim);">
        <strong>Demo Accounts:</strong><br>
        <code>demo@studyvault.edu</code> / <code>demo123</code><br>
        <code>alex@studyvault.edu</code> / <code>alex123</code>
      </div>
    </div>
  </div>
</body>
</html>
